apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: infra-tools
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    targetRevision: 75.16.1
    chart: kube-prometheus-stack
    helm:
      skipCrds: true
      values: |
        grafana:
          adminPassword: prom-operator
          ingress:
            enabled: false
        prometheus:
          ingress:
            enabled: false
        alertmanager:
          ingress:
            enabled: false
        prometheusOperator:
          admissionWebhooks:
            enabled: false
            patch:
              enabled: false
            certManager:
              enabled: false
        defaultRules:
          create: true
          rules:
            cpu: true
            memory: true
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
