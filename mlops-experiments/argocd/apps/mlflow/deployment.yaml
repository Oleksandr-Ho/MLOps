apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow-tracking
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow-tracking
    app.kubernetes.io/component: tracking
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-tracking
      app.kubernetes.io/component: tracking
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-tracking
        app.kubernetes.io/component: tracking
    spec:
      containers:
        - name: mlflow
          image: python:3.10-slim
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              pip install --no-cache-dir \
                mlflow==2.9.2 \
                boto3==1.28.69 \
                psycopg2-binary==2.9.9 && \
              mlflow server \
                --host 0.0.0.0 \
                --port 5000 \
                --backend-store-uri "${BACKEND_STORE_URI}" \
                --default-artifact-root "${ARTIFACT_ROOT}"
          env:
            - name: BACKEND_STORE_URI
              valueFrom:
                secretKeyRef:
                  name: mlflow-tracking-config
                  key: backend-store-uri
            - name: ARTIFACT_ROOT
              valueFrom:
                secretKeyRef:
                  name: mlflow-tracking-config
                  key: artifact-root
            - name: MLFLOW_S3_ENDPOINT_URL
              valueFrom:
                secretKeyRef:
                  name: mlflow-tracking-config
                  key: s3-endpoint
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mlflow-tracking-config
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mlflow-tracking-config
                  key: aws-secret-access-key
            - name: AWS_DEFAULT_REGION
              value: eu-central-1
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1536Mi
