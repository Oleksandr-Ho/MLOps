apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mlflow-minio
  namespace: mlflow
  labels:
    app.kubernetes.io/name: mlflow-minio
spec:
  serviceName: mlflow-minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mlflow-minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mlflow-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-06-13T22-53-53Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          envFrom:
            - secretRef:
                name: mlflow-minio-credentials
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: api
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
